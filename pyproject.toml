[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text-guided-material-transfer"
version = "0.1.0"
description = "Modular ZeST-style material transfer and component ablations"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch==2.5.1", "diffusers==0.32.2", "transformers==4.46.3",
  "accelerate==1.2.1", "huggingface-hub==0.27.1", "safetensors>=0.4.5,<0.6",
  "numpy>=1.26,<2", "Pillow>=10.4,<12", "sentencepiece>=0.2,<0.3", "scipy==1.14.1"
]

[project.optional-dependencies]
ui = ["gradio==5.9.1", "fastapi==0.115.6", "pydantic==2.10.4"]
auto-mask = ["rembg[cpu]==2.0.61", "opencv-python-headless==4.10.0.84"]
dev = ["pytest>=8,<9"]
prep = ["opencv-python-headless==4.10.0.84"]
eval = ["lpips==0.1.4"]

[project.scripts]
material-transfer = "material_transfer.cli:main"

[tool.setuptools.packages.find]
include = ["material_transfer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
